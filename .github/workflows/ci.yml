name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 依赖
        run: flutter pub get
      - name: 静态分析（无新增问题，AGENTS §6.4）
        run: flutter analyze
      - name: 全量测试（FSRS golden / 会话续学 / 数据库迁移）
        run: flutter test
      - name: 构建 release APK
        run: flutter build apk --release
      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
