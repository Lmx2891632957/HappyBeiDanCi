name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 依赖
        run: flutter pub get
      - name: 静态分析（无新增问题，AGENTS §6.4）
        run: flutter analyze
      - name: 全量测试（FSRS golden / 会话续学 / 数据库迁移）
        run: flutter test
      - name: 注入内置内容（词库 DB + 发音音频，TD-14 内容全内置）
        # 构建 APK 前从 GitHub Release（当前 wordbook-gaokao-3500-v1.1，与
        # WordbookInstaller.defaultLatestVersion 对齐）拉取产物注入 assets/，
        # manifest SHA-256 校验（脚本内完成，口径同 App 端 §8.2/§9.2）。
        run: bash tools/scripts/inject_assets.sh 1.1
      - name: 构建 release APK
        run: flutter build apk --release
      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
